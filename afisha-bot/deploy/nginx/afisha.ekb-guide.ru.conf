# nginx для afisha.ekb-guide.ru — сайт афиши отдаётся прямо из клона репозитория.
# __PHP_FPM_SOCK__ при установке заменяется на реальный сокет php-fpm (например /run/php/php8.3-fpm.sock).
# Ставится на сервер в /etc/nginx/sites-enabled/afisha.ekb-guide.ru (см. afisha-site/README.md).
server {
    server_name afisha.ekb-guide.ru;
    root /root/claude-repo/afisha-site;
    index index.html;
    charset utf-8;

    # SEO-страница события и список всех событий — event.php
    location ~ ^/afisha/([A-Za-z0-9_-]+)/?$ {
        rewrite ^/afisha/([A-Za-z0-9_-]+)/?$ /event.php?slug=$1 last;
    }
    location ~ ^/afisha/?$ {
        rewrite ^ /event.php last;
    }
    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
    }

    # служебное наружу не отдаём
    location ~ /\. { deny all; }
    location ~ \.md$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/afisha.ekb-guide.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/afisha.ekb-guide.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = afisha.ekb-guide.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name afisha.ekb-guide.ru;
    return 404; # managed by Certbot
}
