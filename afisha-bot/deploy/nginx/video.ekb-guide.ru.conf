server {
    listen 80;
    server_name video.ekb-guide.ru;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name video.ekb-guide.ru;
    ssl_certificate     /etc/letsencrypt/live/video.ekb-guide.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.ekb-guide.ru/privkey.pem;
    location / {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;          # пробросить Range
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;                          # стриминг без буферизации nginx
    }
}
