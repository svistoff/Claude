[program:afisha-bot]
directory=/root/afisha-bot
command=/root/afisha-bot/venv/bin/python -m bot.bot
autostart=true
autorestart=true
user=root
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/var/log/afisha-bot.out.log
stderr_logfile=/var/log/afisha-bot.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
