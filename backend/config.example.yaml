# ============================================================================
# Несекретная конфигурация AI Coding Agent.
# Секреты (API-ключи, пароли) — только в .env, не здесь.
# ============================================================================

# --- LLM-провайдер ----------------------------------------------------------
# Абстракция позволяет заменить провайдера/модель без изменения agent loop.
llm:
  provider: deepseek
  # Имя модели по умолчанию. Переопределяется DEEPSEEK_MODEL из .env и
  # выбором пользователя в UI (переключатель, хранится в БД).
  # Актуальные имена официального API: deepseek-flash (быстрая/дешёвая),
  # deepseek-v4-pro (мощнее/дороже).
  model: deepseek-flash
  # Модели, доступные для переключения в интерфейсе.
  available_models:
    - deepseek-flash
    - deepseek-v4-pro
  temperature: 0.2
  max_tokens: 4096
  # request_timeout — таймаут одного запроса к API, сек.
  request_timeout: 120

# --- Тарифы DeepSeek (USD за 1M токенов) ------------------------------------
# Вынесены в одно место (раздел 27 ТЗ). Обновляйте при смене тарифа.
# Значения — официальные off-peak на сентябрь 2026. Пиковые часы удваиваются.
# input_cache_hit — цена входных токенов, попавших в контекст-кэш DeepSeek.
pricing:
  currency: USD
  models:
    deepseek-flash:
      input: 0.15
      input_cache_hit: 0.003
      output: 0.60
    deepseek-v4-pro:
      input: 0.66
      input_cache_hit: 0.022
      output: 1.98
  # Тариф по умолчанию, если модель не найдена в списке выше.
  default:
    input: 0.15
    input_cache_hit: 0.003
    output: 0.60
  # Пиковые часы (UTC, пн–пт) — стоимость ×peak_multiplier.
  peak_multiplier: 2.0
  peak_windows_utc:
    - [1, 4]
    - [6, 10]

# --- Лимиты агента ----------------------------------------------------------
agent:
  # Максимум итераций (шагов) цикла за один запуск (раздел 37 ТЗ).
  # При достижении лимита в UI есть кнопка «Продолжить». Поднимайте для длинных задач.
  max_iterations: 50
  # Таймауты terminal-команд, сек (раздел 21 ТЗ).
  terminal_timeout_default: 60
  terminal_timeout_max: 300
  # Максимальный размер читаемого файла (защита от раздувания контекста), байт.
  max_read_bytes: 200000
  # Максимум результатов поиска, возвращаемых модели.
  max_search_results: 100

# --- Проекты (раздел 6 ТЗ) --------------------------------------------------
# Агент видит ТОЛЬКО эти директории. Все операции — относительно root проекта.
# ВАЖНО: укажите фактические пути на VPS при установке.
projects:
  - name: fuckwell-crm
    path: /var/www/fuckwell-crm
  - name: gorod-dating
    path: /var/www/gorod-dating
  - name: unified_bot
    path: /var/www/unified_bot
  - name: f_chatsbot
    path: /var/www/f_chatsbot

# --- Workspace для новых проектов -------------------------------------------
# Внутри этой папки кнопка «+ Новый проект» создаёт новые проекты (git init).
# Песочница сохраняется: агент не выходит за пределы созданного проекта.
# Создайте папку и дайте доступ пользователю aiagent (см. deploy/README.md).
workspace: /var/www/ai-workspace

# --- Фильтр секретных файлов (разделы 9.2, 44 ТЗ) ---------------------------
# Эти паттерны НЕ показываются в list/search и НЕ читаются read/edit.
# Применяется на уровне ВСЕХ файловых инструментов.
secret_patterns:
  - ".env"
  - ".env.*"
  - "*.pem"
  - "*.key"
  - "id_rsa"
  - "id_rsa.*"
  - "id_ed25519"
  - "id_ed25519.*"
  - "credentials*"
  - "*.p12"
  - "*.pfx"
  - ".git/config"
  - "*.secret"
  - "secrets.*"

# --- Опасные команды терминала (разделы 9.5, 10 ТЗ) -------------------------
# match: подстроки/regex, при совпадении команда требует подтверждения (confirm)
#        либо блокируется (block).
terminal_policy:
  # Полностью запрещённые (никогда, даже с подтверждением).
  blocked:
    - "mkfs"
    - "dd if="
    - ":(){:|:&};:"          # fork bomb
    - "> /dev/sd"
  # Требуют явного подтверждения пользователя в UI.
  confirm:
    - "rm -rf"
    - "rm -fr"
    - "rm -r"
    - "git push"
    - "shutdown"
    - "reboot"
    - "passwd"
    - "userdel"
    - "iptables"
    - "systemctl stop"
    - "systemctl restart"
    - "systemctl disable"
    - "supervisorctl stop"
    - "docker system prune"
    - "docker rm"
    - "docker rmi"
    - "chmod -R"
    - "chown -R"
    - "truncate"
    - "apt install"
    - "apt-get install"
    - "pip uninstall"
    - "nginx"           # правка/перезапуск nginx
    - "certbot"
