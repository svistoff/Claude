# nginx reverse-proxy для ai.svistoff.ru (разделы 23–24 ТЗ).
# Порт приложения (127.0.0.1:8770) НЕ открыт наружу — только через nginx.
# ВНИМАНИЕ: 8770 выбран как свободный на VPS; 8000/8010/8080/8090.. уже заняты.
#
# Установка:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/ai.svistoff.ru
#   sudo ln -s /etc/nginx/sites-available/ai.svistoff.ru /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d ai.svistoff.ru      # выпустит сертификат и настроит 443
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP -> HTTPS редирект.
server {
    listen 80;
    listen [::]:80;
    server_name ai.svistoff.ru;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ai.svistoff.ru;

    # Сертификаты (certbot заполнит эти пути автоматически).
    ssl_certificate     /etc/letsencrypt/live/ai.svistoff.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.svistoff.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=63072000" always;

    # Ограничение размера загружаемых файлов (раздел 17 ТЗ).
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Стриминг (SSE, раздел 25 ТЗ): отключаем буферизацию, длинные таймауты.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
