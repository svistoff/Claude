# random.ekb-guide.ru -> randomgiveaway (FastAPI, uvicorn на 127.0.0.1:8001)
#
# Установка:
#   sudo cp deploy/nginx/random-giveaway.conf /etc/nginx/sites-available/random-giveaway.conf
#   sudo ln -s /etc/nginx/sites-available/random-giveaway.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS выпускается отдельно через certbot (см. randomgiveaway/README.md) —
# certbot сам допишет сюда listen 443 ssl и редирект с 80 на 443.

server {
    listen 80;
    listen [::]:80;
    server_name random.ekb-guide.ru;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
