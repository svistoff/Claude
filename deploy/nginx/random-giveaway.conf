# random.ekb-guide.ru -> randomgiveaway
#
# Фронтенд (Vite/React SPA, статическая сборка) отдаётся напрямую Nginx'ом,
# бэкенд (FastAPI, uvicorn на 127.0.0.1:8001) — через прокси на конкретные
# пути. Клиентский роутинг (react-router) требует fallback на index.html.
#
# ВАЖНО про HTTPS: если certbot уже применялся к этому серверному блоку
# раньше (см. randomgiveaway/README.md, шаг 6 деплоя), реальный файл на
# сервере уже содержит блок `listen 443 ssl` и пути к сертификату, которых
# нет в этой версии файла в репозитории. Не затирайте существующий файл
# этим целиком — либо точечно добавьте недостающие location-блоки (root,
# try_files, новые proxy_pass) в уже существующий файл на сервере, либо,
# если разворачиваете с нуля, используйте этот файл как есть и запустите
# certbot заново (см. README).
#
# Установка (с нуля, без HTTPS):
#   sudo cp deploy/nginx/random-giveaway.conf /etc/nginx/sites-available/random-giveaway.conf
#   sudo ln -s /etc/nginx/sites-available/random-giveaway.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d random.ekb-guide.ru

server {
    listen 80;
    listen [::]:80;
    server_name random.ekb-guide.ru;

    root /root/random-giveaway/randomgiveaway/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(docs|openapi\.json|health|privacy|terms)$ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri /index.html;
    }
}
