# ВРЕМЕННЫЙ доступ к posmon, когда не работает DNS домена (авария Beget).
# sslip.io сам резолвит имя в IP из имени — DNS домена не нужен.
# Основной конфиг stat.xmassage.vip не трогаем: когда DNS починится, домен
# заработает сам. Убрать временный адрес:
#   rm /etc/nginx/sites-enabled/stat-temp.conf && nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name stat-45-146-90-128.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    client_max_body_size 16m;
}
