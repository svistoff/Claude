# nginx-конфиг для админки posmon на stat.xmassage.vip
# Положить в /etc/nginx/sites-available/stat.xmassage.vip
# и слинковать в /etc/nginx/sites-enabled/.
# TLS добавит certbot автоматически (см. deploy/INSTALL.md).

server {
    listen 80;
    server_name stat.xmassage.vip;

    # Проксируем всё на приложение (StaticFiles отдаёт /static само).
    location / {
        proxy_pass http://127.0.0.1:8600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    client_max_body_size 16m;   # запас под импорт CSV/XLSX
}
