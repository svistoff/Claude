# Nginx reverse proxy для work.noir-ekb.com -> FastAPI (uvicorn на 127.0.0.1:8090)
#
# Установка на сервере:
#   cp deploy/nginx/work-attendance.conf /etc/nginx/sites-available/work-attendance.conf
#   ln -s /etc/nginx/sites-available/work-attendance.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d work.noir-ekb.com   # выпустит сертификат и сам допишет блок 443/redirect
#
# Ниже — состояние ДО certbot (только HTTP). После certbot --nginx этот файл
# будет автоматически дополнен блоком `listen 443 ssl` и редиректом
# 80 -> 443, поэтому секцию HTTPS вручную дописывать не нужно.

server {
    listen 80;
    listen [::]:80;
    server_name work.noir-ekb.com;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
