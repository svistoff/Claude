[program:ai-companion-bot]
command=/root/ai-companion-bot/venv/bin/python -m companion_bot.bot
directory=/root/ai-companion-bot
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/var/log/ai-companion-bot.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/ai-companion-bot.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
