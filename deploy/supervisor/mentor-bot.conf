[program:mentor-bot]
command=/root/mentor-bot/venv/bin/python -m mentor_bot
directory=/root/mentor-bot
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/var/log/mentor-bot.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/mentor-bot.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
