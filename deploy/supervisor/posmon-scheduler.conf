[program:posmon-scheduler]
command=/root/posmon/.venv/bin/python -m posmon.scheduler
directory=/root/posmon
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=INT
stopwaitsecs=20
stdout_logfile=/var/log/posmon-scheduler.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/posmon-scheduler.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
