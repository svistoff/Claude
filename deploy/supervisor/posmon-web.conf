[program:posmon-web]
command=/root/posmon/.venv/bin/uvicorn posmon.asgi:app --host 127.0.0.1 --port 8010
directory=/root/posmon
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/var/log/posmon-web.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/posmon-web.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
