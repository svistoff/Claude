[program:telegram-cleaner]
command=/root/telegram-cleaner/venv/bin/python3 /root/telegram-cleaner/cleaner.py
directory=/root/telegram-cleaner
user=root
autostart=true
; Обычный "unexpected" здесь ВАЖЕН, не "true": cleaner.py — не постоянный сервис,
; а разовая пакетная задача. Когда список целей кончается, скрипт корректно
; завершается (exit 0) — это не сбой, а норма, и Supervisor не должен его снова
; поднимать. Перезапуск нужен только если процесс упал аварийно (сеть, краш).
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=10
stopsignal=INT
stopwaitsecs=15
stdout_logfile=/var/log/telegram-cleaner.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/telegram-cleaner.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
