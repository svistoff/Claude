[program:work-attendance]
command=/root/work-attendance/venv/bin/uvicorn attendance.main:app --host 127.0.0.1 --port 8090
directory=/root/work-attendance
user=root
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/log/work-attendance.out.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stderr_logfile=/var/log/work-attendance.err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=5
environment=PYTHONUNBUFFERED="1"
