# nginx для news.ekb-guide.ru (как установлено на сервере, с SSL от certbot).
# Сайт отдаётся прямо из отдельного клона репозитория /root/afisha-news-bot
# (ветка claude/news-bot), чтобы не мешать сайту афиши в /root/claude-repo.
# Файл на сервере: /etc/nginx/sites-available/news.ekb-guide.ru
server {
    server_name news.ekb-guide.ru;
    root /root/afisha-news-bot/news-bot/site;
    index index.html;
    charset utf-8;

    # SEO-страница новости и карта сайта — PHP
    location ~ ^/n/([A-Za-z0-9_-]+)/?$ {
        rewrite ^/n/([A-Za-z0-9_-]+)/?$ /news.php?slug=$1 last;
    }
    location = /sitemap.xml {
        rewrite ^ /sitemap.php last;
    }
    location = /sb-config.php { return 404; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # виджет для Tilda: кэш короткий, версию меняем через ?v=
    location = /news-embed.js {
        add_header Cache-Control "public, max-age=300";
    }

    location ~ /\. { deny all; }
    location ~ \.md$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/news.ekb-guide.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/news.ekb-guide.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = news.ekb-guide.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name news.ekb-guide.ru;
    return 404; # managed by Certbot


}