[program:news-bot]
directory=/root/news-bot
command=/root/news-bot/venv/bin/python -m bot.bot
autostart=true
autorestart=true
user=root
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/var/log/news-bot.out.log
stderr_logfile=/var/log/news-bot.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
