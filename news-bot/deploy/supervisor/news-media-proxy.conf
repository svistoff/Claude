[program:news-media-proxy]
directory=/root/news-bot
command=/root/news-bot/venv/bin/python -m bot.proxy.server
autostart=true
autorestart=true
user=root
environment=PYTHONUNBUFFERED="1"
stdout_logfile=/var/log/news-media-proxy.out.log
stderr_logfile=/var/log/news-media-proxy.err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
