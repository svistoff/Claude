<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Новости одной строкой — Екатеринбург | ЕКБ ГИД</title>
<meta name="description" content="Главные новости Екатеринбурга коротко: одна строка — одна новость. Полный текст, фото и видео — по клику." />
<link rel="canonical" href="https://news.ekb-guide.ru/" />
<meta property="og:type" content="website" />
<meta property="og:title" content="Новости одной строкой — ЕКБ ГИД" />
<meta property="og:description" content="Главные новости Екатеринбурга коротко: одна строка — одна новость." />
<meta property="og:url" content="https://news.ekb-guide.ru/" />
<meta property="og:site_name" content="ЕКБ ГИД" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://sb.ekb-guide.ru">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Дизайн-код ЕКБ ГИД (как ekb-guide.ru/price): кремовая бумага, чёрная типографика,
     жёлтый маркер, заголовки — Montserrat 700, текст — Inter, подписи — JetBrains Mono. */
  :root{
    --paper:#F4F1E9; --card:#FFFDF7; --ink:#191512; --muted:#6F6A60; --line:#E4DFCF;
    --hl:#F5E24B; --hl-soft:#FCF4B4;
    --pink:#F2C9D4; --green:#CBE4C2; --blue:#C7DAEE; --lilac:#DACFEC;
    --shadow:0 10px 26px rgba(25,21,18,.09);
    --shadow-lg:0 18px 50px rgba(25,21,18,.22);
    --disp:'Montserrat',-apple-system,'Segoe UI',sans-serif;
    --sans:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{font-family:var(--sans);font-size:16px;line-height:1.55;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  a{color:inherit;}
  button{font:inherit;}
  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 72px;}

  /* шапка */
  .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .top a{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;color:var(--muted);}
  .top a:hover{color:var(--ink);}
  .top nav{display:flex;gap:18px;}
  .head{position:relative;margin:34px 0 8px;}
  .eyebrow{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 13px;margin-bottom:22px;background:var(--card);}
  .head h1{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:clamp(32px,7vw,58px);line-height:1.03;letter-spacing:-.005em;margin:0;}
  .hl{background-image:linear-gradient(var(--hl),var(--hl));background-repeat:no-repeat;background-position:0 82%;background-size:100% 64%;padding:.02em .16em;-webkit-box-decoration-break:clone;box-decoration-break:clone;}
  .head h1 .hl{background-size:0% 64%;animation:mark .65s cubic-bezier(.2,.7,.3,1) .25s forwards;}
  @keyframes mark{to{background-size:100% 64%;}}
  .head p{margin:16px 0 0;color:var(--muted);font-size:clamp(16px,1.7vw,19px);max-width:560px;}
  .confetti{position:absolute;top:-6px;right:0;width:96px;height:72px;animation:sway 6s ease-in-out infinite;pointer-events:none;}
  @keyframes sway{50%{transform:translateY(5px) rotate(4deg);}}
  @media(max-width:600px){.confetti{width:64px;height:48px;top:-20px;}}

  /* лента */
  .feed{list-style:none;margin:30px 0 0;padding:0;}
  .item{border-top:1px solid var(--line);}
  .item:last-child{border-bottom:1px solid var(--line);}
  .item a{display:block;padding:18px 12px;margin:0 -12px;text-decoration:none;border-radius:16px;transition:background .16s ease;}
  .item a:hover{background:var(--card);}
  .item a:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}
  .t{font-family:var(--disp);font-weight:700;font-size:clamp(17px,3.6vw,19px);line-height:1.2;margin:0;letter-spacing:-.005em;}
  .s{margin:6px 0 0;color:var(--ink);opacity:.86;font-size:15.5px;line-height:1.5;}
  .d{margin-top:9px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;}
  .tag{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;background:var(--hl-soft);color:var(--ink);border-radius:6px;padding:2px 8px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--disp);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;padding:13px 24px;border-radius:999px;cursor:pointer;border:1.5px solid var(--ink);color:var(--ink);background:transparent;text-decoration:none;transition:transform .16s ease,box-shadow .16s ease,background .16s ease,color .16s ease;}
  .btn:hover{transform:translateY(-2px);background:var(--ink);color:var(--paper);}
  .btn-primary{background:var(--hl);border-color:var(--hl);}
  .btn-primary:hover{background:var(--hl);color:var(--ink);box-shadow:0 8px 18px rgba(245,226,75,.55);}
  .btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}
  .more{display:flex;margin:28px auto 0;}
  .more[disabled]{opacity:.5;cursor:default;transform:none;}
  .more[hidden]{display:none;}
  .state{padding:44px 8px;text-align:center;color:var(--muted);}
  .state b{display:block;font-family:var(--disp);font-weight:700;color:var(--ink);font-size:18px;margin-bottom:6px;}
  .skel{height:84px;border-top:1px solid var(--line);background:linear-gradient(90deg,transparent,rgba(25,21,18,.04),transparent) 0 0/200% 100%;animation:sh 1.2s infinite;}
  @keyframes sh{to{background-position:-200% 0;}}
  .foot{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;}
  .foot a{color:var(--ink);text-decoration:none;}
  .foot a:hover{text-decoration:underline;}

  /* модальное окно */
  .ov{position:fixed;inset:0;z-index:1000;background:rgba(25,21,18,.55);display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .16s ease;}
  @keyframes fade{from{opacity:0;}}
  .mod{width:min(760px,100%);max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--card);border-radius:24px;box-shadow:var(--shadow-lg);}
  .mb{padding:24px 26px 28px;}
  .mt{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;}
  .mt h2{font-family:var(--disp);font-weight:700;font-size:clamp(22px,4.2vw,30px);line-height:1.12;margin:0;letter-spacing:-.005em;}
  .x{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:17px;line-height:1;padding:0;transition:border-color .16s ease;}
  .x:hover{border-color:var(--ink);}
  .md{margin-top:10px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .msum{font-size:17px;line-height:1.5;color:var(--ink);margin:14px 0 0;font-weight:500;}
  .gal{margin:18px -26px 0;display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:0 26px;}
  .gal::-webkit-scrollbar{display:none;}
  .gal>*{flex:0 0 auto;scroll-snap-align:center;max-width:100%;max-height:62vh;border-radius:16px;background:var(--line);display:block;}
  .gal.one>*{margin:0 auto;}
  .gal img{width:auto;height:auto;object-fit:contain;}
  .gal video{width:100%;background:var(--ink);}
  .gal.many>*{max-width:88%;}
  .gal.many img{height:min(56vh,420px);width:auto;object-fit:cover;}
  .gal.many video{height:min(56vh,420px);width:auto;}
  .cnt{text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:10px;}
  .body{margin-top:18px;font-size:16px;line-height:1.65;color:var(--ink);max-width:640px;}
  .body p{margin:0 0 12px;white-space:pre-line;overflow-wrap:anywhere;}
  .body a{color:var(--ink);text-decoration-color:var(--hl);text-decoration-thickness:3px;text-underline-offset:2px;}
  .acts{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-top:20px;padding-top:18px;border-top:1px solid var(--line);}
  .acts a.lnk{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-decoration:none;}
  .acts a.lnk:hover{color:var(--ink);}
  @media(max-width:600px){
    .ov{align-items:flex-end;padding:0;}
    .mod{width:100%;max-height:94vh;border-radius:20px 20px 0 0;}
    .mb{padding:18px 16px calc(24px + env(safe-area-inset-bottom));}
    .gal{margin:16px -16px 0;padding:0 16px;}
    .acts .btn{width:100%;}
  }
  @media(prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
    .head h1 .hl{background-size:100% 64%;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="https://ekb-guide.ru/">← ЕКБ ГИД</a>
    <nav><a href="https://afisha.ekb-guide.ru/">Афиша</a></nav>
  </div>
  <header class="head">
    <svg class="confetti" viewBox="0 0 96 72" aria-hidden="true"><circle cx="10" cy="38" r="5" fill="#F2C9D4"/><rect x="40" y="6" width="9" height="9" rx="1" transform="rotate(45 44.5 10.5)" fill="#F5E24B"/><rect x="76" y="20" width="10" height="10" rx="2" fill="#CBE4C2"/><circle cx="88" cy="52" r="4" fill="#C7DAEE"/><rect x="22" y="58" width="8" height="8" rx="1" transform="rotate(45 26 62)" fill="#DACFEC"/><circle cx="58" cy="62" r="6" fill="#F5E24B"/></svg>
    <span class="eyebrow">ЕКБ ГИД · Новости</span>
    <h1>Новости <span class="hl">одной строкой</span></h1>
    <p>Главное в Екатеринбурге коротко. Нажмите на новость — откроется полный текст, фото и видео.</p>
  </header>

  <ul class="feed" id="feed" aria-live="polite">
    <li class="skel"></li><li class="skel"></li><li class="skel"></li><li class="skel"></li>
  </ul>
  <button class="btn more" id="more" type="button" hidden>Показать ещё</button>

  <div class="foot">© ЕКБ ГИД · <a href="https://ekb-guide.ru/">ekb-guide.ru</a> · <a href="https://afisha.ekb-guide.ru/">Афиша Екатеринбурга</a></div>
</div>

<script>
(function(){
  var SB='https://sb.ekb-guide.ru';
  var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhibWRwcW5zZXl3cGh3Z3hzbmxnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MjE1NzYsImV4cCI6MjA5NTI5NzU3Nn0.wLuTKZ-uhCQ69iEm6gyJrsgaP0NgVL-PBad3kJD7uHU';
  var MEDIA='https://video.ekb-guide.ru/m/';
  var SITE='https://news.ekb-guide.ru';
  var PAGE=20;
  var SELECT='slug,title,summary,body,published_at,news_media(position,kind,token,width,height)';
  var MONTHS=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

  var feed=document.getElementById('feed'), moreBtn=document.getElementById('more');
  var ITEMS={}, offset=0;

  function esc(s){s=(s==null?'':''+s);return s.replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];});}
  function linkify(escaped){
    return escaped.replace(/(https?:\/\/[^\s<>"']+[^\s<>"'.,;:!?)\]])/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener">'+u+'</a>';});
  }
  function paragraphs(text){
    return String(text||'').trim().split(/\n\s*\n/).map(function(p){return '<p>'+linkify(esc(p.trim()))+'</p>';}).join('');
  }
  // даты — по Екатеринбургу, независимо от часового пояса посетителя
  function ekbDay(d){
    var p=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Yekaterinburg',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
    return p; // YYYY-MM-DD
  }
  function dayLabel(iso){
    var d=new Date(iso), key=ekbDay(d), now=new Date();
    if(key===ekbDay(now)) return 'опубликовано сегодня';
    if(key===ekbDay(new Date(now.getTime()-864e5))) return 'опубликовано вчера';
    var p=key.split('-'); var s=parseInt(p[2],10)+' '+MONTHS[parseInt(p[1],10)-1];
    if(p[0]!==ekbDay(now).slice(0,4)) s+=' '+p[0];
    return s;
  }
  function media(n){return (n.news_media||[]).slice().sort(function(a,b){return a.position-b.position;});}
  function mediaBadge(n){
    var m=media(n), ph=0, vi=0; m.forEach(function(x){x.kind==='video'?vi++:ph++;});
    var out=[]; if(ph) out.push('<span class="tag">'+(ph>1?ph+' фото':'фото')+'</span>'); if(vi) out.push('<span class="tag">'+(vi>1?vi+' видео':'видео')+'</span>');
    return out.join('');
  }
  function newsUrl(n){return SITE+'/n/'+encodeURIComponent(n.slug);}

  function itemHtml(n){
    return '<li class="item"><a href="/n/'+esc(encodeURIComponent(n.slug))+'" data-slug="'+esc(n.slug)+'">'+
      '<h2 class="t">'+esc(n.title)+'</h2>'+
      (n.summary?'<p class="s">'+esc(n.summary)+'</p>':'')+
      '<div class="d"><span>'+esc('опубликовано '+dayLabel(n.published_at))+'</span>'+mediaBadge(n)+'</div></a></li>';
  }

  function api(q){
    return fetch(SB+'/rest/v1/news?'+q,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status); return r.json();
    });
  }

  function loadPage(){
    moreBtn.disabled=true;
    return api('select='+SELECT+'&order=published_at.desc&news_media.order=position.asc&limit='+PAGE+'&offset='+offset).then(function(rows){
      if(offset===0) feed.innerHTML='';
      if(offset===0&&!rows.length){
        feed.innerHTML='<li class="state"><b>Пока новостей нет</b>Загляните чуть позже.</li>';
        moreBtn.hidden=true; return;
      }
      var html='';
      rows.forEach(function(n){ ITEMS[n.slug]=n; html+=itemHtml(n); });
      feed.insertAdjacentHTML('beforeend',html);
      offset+=rows.length;
      moreBtn.hidden=rows.length<PAGE; moreBtn.disabled=false;
    }).catch(function(){
      moreBtn.disabled=false;
      if(offset===0) feed.innerHTML='<li class="state"><b>Не удалось загрузить новости</b>Проверьте интернет и обновите страницу.</li>';
      else moreBtn.textContent='Не загрузилось — попробовать ещё';
    });
  }
  moreBtn.addEventListener('click',function(){ moreBtn.textContent='Показать ещё'; loadPage(); });

  // ---------- модальное окно ----------
  var ov=null, current=null, pushed=false;
  function galleryHtml(n){
    var m=media(n); if(!m.length) return '';
    var cls=m.length>1?'many':'one';
    var items=m.map(function(x){
      var src=MEDIA+encodeURIComponent(x.token);
      var dims=(x.width&&x.height)?' width="'+(+x.width)+'" height="'+(+x.height)+'"':'';
      return x.kind==='video'
        ? '<video src="'+esc(src)+'" controls playsinline preload="metadata"'+dims+'></video>'
        : '<img src="'+esc(src)+'" loading="lazy" alt=""'+dims+' onerror="this.remove()">';
    }).join('');
    return '<div class="gal '+cls+'">'+items+'</div>'+(m.length>1?'<div class="cnt">'+m.length+' · листайте →</div>':'');
  }
  function modalHtml(n){
    return '<div class="mod" role="dialog" aria-modal="true" aria-labelledby="mt"><div class="mb">'+
      '<div class="mt"><h2 id="mt">'+esc(n.title)+'</h2><button type="button" class="x" data-close aria-label="Закрыть">✕</button></div>'+
      '<div class="md">'+esc('опубликовано '+dayLabel(n.published_at))+'</div>'+
      (n.summary?'<p class="msum">'+esc(n.summary)+'</p>':'')+
      galleryHtml(n)+
      (n.body?'<div class="body">'+paragraphs(n.body)+'</div>':'')+
      '<div class="acts"><button type="button" class="btn btn-primary" data-share>Поделиться <span aria-hidden="true">→</span></button>'+
      '<a class="lnk" href="'+esc(newsUrl(n))+'">Ссылка на новость</a></div>'+
    '</div></div>';
  }
  function share(btn){
    var url=newsUrl(current);
    if(navigator.share){ navigator.share({title:current.title,text:current.summary||'',url:url}).catch(function(){}); return; }
    var done=function(){btn.textContent='Ссылка скопирована ✓';};
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done,function(){window.prompt('Скопируйте ссылку:',url);});
    else window.prompt('Скопируйте ссылку:',url);
  }
  function openModal(n,fromHistory){
    current=n;
    if(!ov){
      ov=document.createElement('div'); ov.className='ov';
      ov.addEventListener('click',function(e){
        var sh=e.target.closest('[data-share]'); if(sh){share(sh);return;}
        if(e.target===ov||e.target.closest('[data-close]')) requestClose();
      });
      document.body.appendChild(ov);
      document.documentElement.style.overflow='hidden';
    }
    ov.innerHTML=modalHtml(n);
    var x=ov.querySelector('.x'); if(x) x.focus({preventScroll:true});
    // адрес новости в строке браузера (как у афиши): ссылку можно скопировать, «Назад» закрывает окно
    if(!fromHistory){ try{history.pushState({news:n.slug},'','/n/'+encodeURIComponent(n.slug));pushed=true;}catch(_){} }
  }
  function closeUI(){
    if(!ov) return;
    ov.querySelectorAll('video').forEach(function(v){try{v.pause();}catch(_){}});
    ov.remove(); ov=null; current=null;
    document.documentElement.style.overflow='';
  }
  function requestClose(){
    if(pushed){ pushed=false; history.back(); }
    else { closeUI(); try{history.replaceState(null,'','/');}catch(_){} }
  }
  window.addEventListener('popstate',function(){
    pushed=false;
    var slug=slugFromUrl();
    if(slug&&ITEMS[slug]) openModal(ITEMS[slug],true); else closeUI();
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&ov) requestClose(); });
  feed.addEventListener('click',function(e){
    var a=e.target.closest('a[data-slug]'); if(!a) return;
    if(e.ctrlKey||e.metaKey||e.shiftKey||e.button===1) return;
    var n=ITEMS[a.getAttribute('data-slug')]; if(!n) return;
    e.preventDefault(); openModal(n);
  });

  function slugFromUrl(){
    var m=location.pathname.match(/^\/n\/([A-Za-z0-9_-]+)\/?$/);
    return m?m[1]:decodeURIComponent(location.hash.slice(1));
  }
  // глубокая ссылка news.ekb-guide.ru/#<slug>
  function openFromHash(){
    var slug=slugFromUrl(); if(!slug) return;
    if(ITEMS[slug]){ openModal(ITEMS[slug],true); return; }
    api('select='+SELECT+'&slug=eq.'+encodeURIComponent(slug)+'&news_media.order=position.asc&limit=1').then(function(rows){
      if(rows&&rows[0]){ ITEMS[slug]=rows[0]; openModal(rows[0],true); }
    }).catch(function(){});
  }
  loadPage().then(openFromHash);
})();
</script>
</body>
</html>
