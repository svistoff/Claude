<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM · Сеть массажных салонов</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --border:#e3e5e9; --text:#1a1c1f; --muted:#6b7280; --accent:#2f6feb; --danger:#d33; --ok:#2a9d5c; --warn:#c98a00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Arial, sans-serif; background:var(--bg); color:var(--text); }
  #login { max-width:340px; margin:12vh auto; background:var(--card); padding:28px; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  #login h1 { font-size:18px; margin-top:0; }
  #login input { width:100%; padding:10px; margin-bottom:10px; border:1px solid var(--border); border-radius:8px; font-size:14px; }
  #login button { width:100%; padding:10px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; }
  #login .err { color:var(--danger); font-size:13px; min-height:18px; }

  #app { display:none; min-height:100vh; }
  .layout { display:flex; min-height:100vh; }
  nav.side { width:220px; background:#1c2230; color:#cfd6e4; flex-shrink:0; padding:16px 0; }
  nav.side .brand { padding:0 16px 16px; font-weight:600; color:#fff; border-bottom:1px solid #2c3345; margin-bottom:8px;}
  nav.side a { display:block; padding:10px 16px; color:#cfd6e4; text-decoration:none; font-size:14px; cursor:pointer; }
  nav.side a:hover, nav.side a.active { background:#2c3345; color:#fff; }
  nav.side .userinfo { padding:12px 16px; font-size:12px; color:#8b93a7; }
  nav.side .logout { padding:6px 16px 16px; }
  main { flex:1; padding:24px; overflow-x:auto; }
  h2 { margin-top:0; } h3 { font-size:15px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:16px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  button, .btn { padding:7px 12px; border-radius:7px; border:1px solid var(--border); background:#fff; cursor:pointer; font-size:13px; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.danger { color:var(--danger); border-color:#f1c6c6; }
  button.ok { color:var(--ok); border-color:#bfe3cd; }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .row.between { justify-content:space-between; }
  input, select, textarea { padding:7px 9px; border:1px solid var(--border); border-radius:7px; font-size:13px; font-family:inherit; }
  textarea { width:100%; min-height:60px; }
  .tag { display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; background:#eef1f5; color:var(--muted); }
  .tag.done { background:#e6f6ec; color:var(--ok); }
  .tag.error { background:#fdeaea; color:var(--danger); }
  .tag.new, .tag.processing { background:#fff6e0; color:#9a7200; }
  .tag.missed { background:#fdeaea; color:var(--danger); }
  .tag.warn { background:#fff2d9; color:var(--warn); }
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-start; justify-content:center; padding:5vh 16px; overflow:auto; z-index:50; }
  .modal { background:#fff; border-radius:12px; padding:20px; width:100%; max-width:720px; }
  .checklist-item { display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--border); }
  .checklist-item .mark { font-size:16px; width:24px; }
  .checklist-item.muted { opacity:0.55; }
  .muted { color:var(--muted); font-size:12px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
  .guest-card { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .guest-card .time { font-size:20px; font-weight:700; }
  .fw-form label { display:flex; flex-direction:column; gap:4px; font-size:13px; }
  .fw-form input { width:100%; box-sizing:border-box; }
  nav.bottom-nav { display:none; }
  @media (max-width:800px){
    .layout{flex-direction:column;}
    .grid2,.grid3{grid-template-columns:1fr;}
    main{padding:14px;}
    nav.side{display:none;}
    nav.bottom-nav{
      display:flex; position:fixed; bottom:0; left:0; right:0; z-index:40;
      background:#1c2230; border-top:1px solid #2c3345; padding-bottom:env(safe-area-inset-bottom);
    }
    nav.bottom-nav a{
      flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:2px; padding:8px 2px 6px; color:#8b93a7; text-decoration:none; font-size:10px; cursor:pointer;
    }
    nav.bottom-nav a .icon{ font-size:19px; line-height:1; }
    nav.bottom-nav a.active{ color:#fff; }
    #app.has-bottom-nav main{ padding-bottom:72px; }
    table.trend-table{ min-width:0 !important; }
    table.trend-table, table.trend-table tbody, table.trend-table tr, table.trend-table td{ display:block; }
    table.trend-table tr.trend-head{ display:none; }
    table.trend-table tr{ border-bottom:1px solid var(--border); padding:8px 0; }
    table.trend-table td{ border:none; padding:2px 0; text-align:left !important; }
    table.trend-table td.t-dot, table.trend-table td.t-label{ display:inline-block; vertical-align:top; }
    table.trend-table td.t-dot{ padding-right:6px; }
    table.trend-table td[data-l]{ display:inline-block; margin-right:14px; }
    table.trend-table td[data-l]::before{ content:attr(data-l) ': '; color:var(--muted); font-size:12px; }
  }
</style>
</head>
<body>

<div id="login">
  <h1>Вход в CRM</h1>
  <input id="login-username" placeholder="Логин" autocomplete="username">
  <input id="login-password" type="password" placeholder="Пароль" autocomplete="current-password">
  <div class="err" id="login-err"></div>
  <button onclick="doLogin()">Войти</button>
</div>

<div id="app">
  <div class="layout">
    <nav class="side" id="side-nav">
      <div class="brand">💆 Сеть салонов</div>
      <div id="nav-links"></div>
      <div class="userinfo" id="userinfo"></div>
      <div class="logout"><button onclick="logout()" style="width:100%">Выйти</button></div>
    </nav>
    <main id="main"></main>
  </div>
  <nav class="bottom-nav" id="bottom-nav"></nav>
</div>

<script>
let ME = null;
let SALONS = [];
let ADMINS = [];

async function api(path, opts) {
  const resp = await fetch('/api' + path, {
    method: (opts && opts.method) || 'GET',
    headers: { 'Content-Type': 'application/json' },
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined
  });
  const json = await resp.json().catch(() => ({}));
  if (!resp.ok) throw new Error(json.error || ('HTTP ' + resp.status));
  return json;
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

// тепловая шкала для Quality Score: красный (0%, реально неправильные ответы) ->
// жёлтый (50%) -> зелёный (100%, всё идеально) — вместо голой дроби "из применимых"
function qualityColor(pct) {
  const stops = pct <= 50 ? [[0xdd,0x33,0x33],[0xc9,0x8a,0x00]] : [[0xc9,0x8a,0x00],[0x2a,0x9d,0x5c]];
  const t = pct <= 50 ? pct / 50 : (pct - 50) / 50;
  const [r1,g1,b1] = stops[0], [r2,g2,b2] = stops[1];
  const r = Math.round(r1 + (r2-r1)*t), g = Math.round(g1 + (g2-g1)*t), b = Math.round(b1 + (b2-b1)*t);
  return `rgb(${r},${g},${b})`;
}
function qualityPct(score, total) { return (score == null || !total) ? null : Math.round((score / total) * 100); }
function qualityBadge(score, total) {
  const pct = qualityPct(score, total);
  if (pct == null) return '<span class="muted">—</span>';
  return `<span style="font-weight:600;color:${qualityColor(pct)}">${pct}%</span>`;
}

function salonCell(c) {
  return esc(c.salon_name) + (c.forwarded_from_name
    ? ` <span class="muted" style="font-size:11px" title="Звонок на номер «${esc(c.forwarded_from_name)}» в часы переадресации">↪ из «${esc(c.forwarded_from_name)}»</span>`
    : '');
}

// показывает первые visibleCount строк таблицы, остальные — под кнопкой
// "Показать ещё N" (без пагинации на сервере — списки у нас не настолько
// большие, чтобы это того стоило, а так один проход по уже загруженным данным)
function paginatedRows(rowsHtml, visibleCount) {
  if (rowsHtml.length <= visibleCount) return rowsHtml.join('');
  const visible = rowsHtml.slice(0, visibleCount).join('');
  const hidden = rowsHtml.slice(visibleCount).join('');
  const id = 'more-' + Math.random().toString(36).slice(2, 9);
  return `${visible}<tbody id="${id}" style="display:none">${hidden}</tbody>
    <tr><td colspan="20" style="text-align:center;padding-top:10px">
      <button onclick="document.getElementById('${id}').style.removeProperty('display');this.closest('tr').style.display='none'">Показать ещё (${rowsHtml.length - visibleCount})</button>
    </td></tr>`;
}

async function doLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-err');
  errEl.textContent = '';
  try { await api('/login', { method: 'POST', body: { username, password } }); await boot(); }
  catch (e) { errEl.textContent = e.message; }
}

async function logout() { await api('/logout', { method: 'POST' }); location.reload(); }

const OWNER_NAV = [
  ['dashboard', 'Дашборд'], ['calls', 'Звонки'], ['admins', 'Администраторы'], ['anketi', 'Анкеты'],
  ['clients', 'Клиенты'], ['reports', 'Отчёты'], ['fuckwell', 'Fuckwell'], ['settings', 'Настройки']
];
const STAFF_NAV = [['guest', 'Гости']];
// Салоны/Чек-листы физически убраны из главного меню и живут как вкладки
// внутри "Настройки" (см. settingsTabsHtml) — но остаются самостоятельными
// route'ами, чтобы не переписывать их рендереры. "Администраторы" и "Анкеты"
// теперь отдельные пункты главного меню (см. OWNER_NAV), а не вкладки Настроек.
const SETTINGS_GROUP = ['settings', 'salons', 'checklist', 'ad-numbers'];
const MOBILE_NAV = [
  ['dashboard', 'Дашборд', '📊'], ['calls', 'Звонки', '📞'], ['anketi', 'Анкеты', '📋'],
  ['clients', 'Клиенты', '👥'], ['reports', 'Отчёты', '📈'], ['fuckwell', 'Fuckwell', '🔥'], ['settings', 'Настройки', '⚙️']
];

async function boot() {
  try { ME = await api('/me'); }
  catch (e) {
    document.getElementById('login').style.display = 'block';
    document.getElementById('app').style.display = 'none';
    return;
  }
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('userinfo').textContent = ME.full_name + ' · ' + (ME.role === 'admin' ? 'владелец' : 'администратор объекта');

  const nav = ME.role === 'admin' ? OWNER_NAV : STAFF_NAV;
  document.getElementById('nav-links').innerHTML = nav.map(([r, label]) => `<a data-route="${r}">${label}</a>`).join('');

  const bottomNav = document.getElementById('bottom-nav');
  bottomNav.innerHTML = ME.role === 'admin'
    ? MOBILE_NAV.map(([r, label, icon]) => `<a data-route="${r}"><span class="icon">${icon}</span>${label}</a>`).join('')
    : '';
  document.getElementById('app').classList.toggle('has-bottom-nav', ME.role === 'admin');

  document.querySelectorAll('nav.side a[data-route], nav.bottom-nav a[data-route]').forEach(a => a.onclick = () => navigate(a.dataset.route));

  SALONS = await api('/salons');
  if (ME.role === 'admin') ADMINS = await api('/admins');

  navigate(location.hash.replace('#', '') || nav[0][0]);
}

const RENDERERS = {};
function navigate(route) {
  location.hash = route;
  document.querySelectorAll('nav.side a, nav.bottom-nav a').forEach(a => {
    const r = a.dataset.route;
    a.classList.toggle('active', r === route || (r === 'settings' && SETTINGS_GROUP.includes(route)));
  });
  (RENDERERS[route] || RENDERERS[ME.role === 'admin' ? 'dashboard' : 'guest'])();
}

// Вкладки над Настройки/Администраторы/Салоны/Чек-листы — эти три раздела
// физически убраны из главного меню и открываются только отсюда.
function settingsTabsHtml(active) {
  const tabs = [['settings', 'Основное'], ['salons', 'Салоны и сауна'], ['checklist', 'Чек-листы'], ['ad-numbers', 'Номера и анкеты']];
  return `<div class="row" style="margin-bottom:16px;border-bottom:1px solid var(--border);padding-bottom:12px">
    ${tabs.map(([r, label]) => `<button class="${r===active?'primary':''}" onclick="navigate('${r}')">${label}</button>`).join('')}
  </div>`;
}

function salonName(id) { return (SALONS.find(s => s.id === id) || {}).name || ('#' + id); }
function adminName(id) { return (ADMINS.find(a => a.id === id) || {}).name || null; }

// ================= ДАШБОРД =================
const PERIOD_LABELS = { today: 'Сегодня', week: 'Неделя', month: 'Месяц' };
let dashboardPeriod = 'today';
let dashboardCustom = null; // { from: 'ГГГГ-ММ-ДД', till: 'ГГГГ-ММ-ДД' }

function dashboardQuery() {
  return dashboardCustom
    ? `date_from=${dashboardCustom.from}&date_till=${dashboardCustom.till}`
    : `period=${dashboardPeriod}`;
}
function fmtDate(d) { return `${d.slice(8, 10)}.${d.slice(5, 7)}.${d.slice(0, 4)}`; }

RENDERERS.dashboard = async function renderDashboard() {
  const d = await api('/dashboard');
  const main = document.getElementById('main');
  const showTimeseries = dashboardCustom ? dashboardCustom.from !== dashboardCustom.till : dashboardPeriod !== 'today';
  main.innerHTML = `
    <h2>Дашборд</h2>
    <div class="card">
      <div class="row between" style="flex-wrap:wrap;gap:8px">
        <h3 style="margin:0">Звонки по объектам${dashboardCustom ? ` <span class="muted" style="font-size:13px;font-weight:400">${fmtDate(dashboardCustom.from)} — ${fmtDate(dashboardCustom.till)}</span>` : ''}</h3>
        <div class="row">
          ${Object.entries(PERIOD_LABELS).map(([key, label]) =>
            `<button class="${!dashboardCustom && dashboardPeriod===key?'primary':''}" onclick="setDashboardPeriod('${key}')">${label}</button>`).join('')}
        </div>
      </div>
      <div class="row" style="margin-top:8px;flex-wrap:wrap">
        <label>С <input id="dash-from" type="date" value="${dashboardCustom ? dashboardCustom.from : ''}"></label>
        <label>По <input id="dash-till" type="date" value="${dashboardCustom ? dashboardCustom.till : ''}"></label>
        <button class="${dashboardCustom ? 'primary' : ''}" onclick="applyDashboardRange()">Показать за период</button>
      </div>
      <div id="dash-chart" style="margin-top:12px">Загрузка…</div>
    </div>
    ${showTimeseries ? `
    <div class="card">
      <h3>📈 Динамика звонков по дням</h3>
      <div id="dash-timeseries" style="margin-top:12px">Загрузка…</div>
    </div>` : ''}
    <div class="card">
      <h3>🔴 Пропущенные без перезвона (${d.missed_no_callback.length})</h3>
      <table><tr><th>Объект</th><th>Дата</th><th>Телефон</th></tr>
        ${paginatedRows(d.missed_no_callback.map(c => `<tr><td>${salonCell(c)}</td><td>${esc(c.started_at)}</td><td>${esc(c.caller_phone||'—')}</td></tr>`), 10) || '<tr><td colspan="3" class="muted">Нет</td></tr>'}
      </table>
    </div>
    <div class="card">
      <h3>⚠️ Звонки с критическими ошибками (14 дней)</h3>
      <table><tr><th>Дата</th><th>Объект</th><th>Администратор</th><th>Ошибка</th><th></th></tr>
        ${paginatedRows(d.critical_calls.map(c => { let err=''; try { const e=JSON.parse(c.critical_errors||'[]')[0]; err = e ? (e.description||e.type||'') : ''; } catch {} return `<tr><td>${esc(c.started_at)}</td><td>${salonCell(c)}</td><td>${esc(c.matched_admin_name||'—')}</td><td>${esc(err)}</td><td><button onclick="openCall(${c.id})">Открыть</button></td></tr>`; }), 10) || '<tr><td colspan="5" class="muted">Нет</td></tr>'}
      </table>
    </div>
    <div class="card">
      <h3>⏳ Неподтверждённые администраторы (${d.unconfirmed_admins.length})</h3>
      <table><tr><th>Имя</th><th>Объект</th><th></th></tr>
        ${d.unconfirmed_admins.map(a => `<tr><td>${esc(a.name)}</td><td>${esc(a.salon_name)}</td>
          <td class="row"><button class="ok" onclick="confirmAdmin(${a.id})">Подтвердить</button><button onclick="showMergeAdminForm(${a.id})">Объединить с...</button><button class="danger" onclick="rejectAdmin(${a.id})">Отклонить</button></td></tr>`).join('') || '<tr><td colspan="3" class="muted">Нет</td></tr>'}
      </table>
    </div>
    <div class="card">
      <h3>📋 Незакрытые дни</h3>
      <table><tr><th>Объект</th><th>Дата</th><th>Записей без отметки</th></tr>
        ${d.unclosed_days.map(u => `<tr><td>${esc(u.salon_name)}</td><td>${esc(u.date)}</td><td>${u.unmarked_count}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Все дни закрыты</td></tr>'}
      </table>
    </div>
  `;
  loadDashboardStats();
  if (showTimeseries) loadDashboardTimeseries();
};

function setDashboardPeriod(period) {
  dashboardPeriod = period;
  dashboardCustom = null;
  RENDERERS.dashboard();
}

function applyDashboardRange() {
  const from = document.getElementById('dash-from').value;
  const till = document.getElementById('dash-till').value;
  if (!from || !till) return alert('Укажите обе даты');
  dashboardCustom = from <= till ? { from, till } : { from: till, till: from };
  RENDERERS.dashboard();
}

async function loadDashboardStats() {
  const { stats } = await api('/dashboard/salon-stats?' + dashboardQuery());
  const total = key => stats.reduce((sum, s) => sum + s[key], 0);
  document.getElementById('dash-chart').innerHTML = renderSalonStatsChart(stats)
    + (stats.length ? `<div style="margin-top:10px"><b>Итого по сети:</b> звонков <b>${total('calls')}</b>,
        пропущено <b style="color:var(--danger)">${total('missed')}</b>,
        перезвонили <b style="color:var(--ok)">${total('called_back')}</b></div>` : '');
}

// За один день график по дням не показываем — это одна точка,
// содержательной динамики в ней нет (см. showTimeseries в шаблоне).
async function loadDashboardTimeseries() {
  const { days } = await api('/dashboard/calls-timeseries?' + dashboardQuery());
  document.getElementById('dash-timeseries').innerHTML = renderCallsTimeseriesChart(days);
}

// Простой сгруппированный столбчатый график без внешних библиотек:
// на каждый объект — 3 столбца (звонки/пропущено/перезвонили) фиксированных
// цветов (синий/красный/зелёный — уже используются в интерфейсе как
// акцент/опасность/успех, поэтому семантически понятны и не требуют легенды-сюрприза).
function renderSalonStatsChart(stats) {
  if (stats.length === 0) return '<p class="muted">Нет активных объектов</p>';
  const maxVal = Math.max(1, ...stats.flatMap(s => [s.calls, s.missed, s.called_back]));
  const barW = 22, barGap = 4, groupGap = 40, chartH = 160;
  const groupW = barW * 3 + barGap * 2;
  const width = stats.length * (groupW + groupGap) + groupGap;
  const scale = v => Math.round((v / maxVal) * (chartH - 20));

  const metrics = [
    { key: 'calls', color: 'var(--accent)' },
    { key: 'missed', color: 'var(--danger)' },
    { key: 'called_back', color: 'var(--ok)' }
  ];

  const groups = stats.map((s, i) => {
    const gx = groupGap + i * (groupW + groupGap);
    const bars = metrics.map((m, j) => {
      const val = s[m.key];
      const h = scale(val);
      const x = gx + j * (barW + barGap);
      const y = chartH - h;
      return `<rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="${m.color}"></rect>
        <text x="${x + barW/2}" y="${y - 4}" text-anchor="middle" font-size="11" fill="currentColor">${val}</text>`;
    }).join('');
    return `${bars}<text x="${gx + groupW/2}" y="${chartH + 18}" text-anchor="middle" font-size="12" fill="currentColor">${esc(s.salon_name)}</text>`;
  }).join('');

  return `
    <svg viewBox="0 0 ${width} ${chartH + 30}" style="width:100%;max-width:720px;height:auto;color:var(--text)">
      <line x1="0" y1="${chartH}" x2="${width}" y2="${chartH}" stroke="var(--border)" stroke-width="1"></line>
      ${groups}
    </svg>
    <div class="row" style="gap:16px;margin-top:8px;font-size:12px">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-right:4px"></span>Звонки</span>

      <span><span style="display:inline-block;width:10px;height:10px;background:var(--ok);border-radius:2px;margin-right:4px"></span>Перезвонили</span>
    </div>`;
}

// Линейный график динамики по дням (звонки/пропущено/перезвонили) за
// выбранный период — те же цвета, что и в сгруппированном графике по
// объектам, для единообразия. Подписи по оси X прореживаются на длинных
// периодах (месяц), чтобы не слипались.
function renderCallsTimeseriesChart(days) {
  if (!days.length) return '<p class="muted">Нет данных</p>';
  const w = Math.max(360, days.length * 32), h = 170, padL = 18, padR = 18, padBottom = 22;
  const maxVal = Math.max(1, ...days.flatMap(d => [d.calls, d.missed, d.called_back]));
  const stepX = days.length > 1 ? (w - padL - padR) / (days.length - 1) : 0;
  const scaleY = v => (h - padBottom) - Math.round((v / maxVal) * (h - padBottom - 16));

  const metrics = [
    { key: 'calls', color: 'var(--accent)' },
    { key: 'missed', color: 'var(--danger)' },
    { key: 'called_back', color: 'var(--ok)' }
  ];
  const series = metrics.map(m => {
    const points = days.map((d, i) => `${(padL + i*stepX).toFixed(1)},${scaleY(d[m.key])}`).join(' ');
    const dots = days.map((d, i) => `<circle cx="${(padL + i*stepX).toFixed(1)}" cy="${scaleY(d[m.key])}" r="2.5" fill="${m.color}"></circle>`).join('');
    return `<polyline points="${points}" fill="none" stroke="${m.color}" stroke-width="2"></polyline>${dots}`;
  }).join('');

  const labelEvery = Math.max(1, Math.ceil(days.length / 10));
  const labels = days.map((d, i) => i % labelEvery !== 0 ? '' : `
    <text x="${(padL + i*stepX).toFixed(1)}" y="${h - 4}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.day.slice(8,10)}.${d.day.slice(5,7)}</text>`).join('');

  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:900px;height:auto;color:var(--text)">
      <line x1="${padL}" y1="${h-padBottom}" x2="${w-padR}" y2="${h-padBottom}" stroke="var(--border)" stroke-width="1"></line>
      ${series}
      ${labels}
    </svg>
    <div class="row" style="gap:16px;margin-top:8px;font-size:12px">
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-right:4px"></span>Звонки</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--danger);border-radius:2px;margin-right:4px"></span>Пропущено</span>
      <span><span style="display:inline-block;width:10px;height:10px;background:var(--ok);border-radius:2px;margin-right:4px"></span>Перезвонили</span>
    </div>`;
}

// Однолинейный вариант того же графика — суммарные звонки по всему пулу
// анкет/номеров за день (без разбивки по меткам: десятки анкет линиями
// разного цвета читать невозможно, для "работает/не работает" конкретной
// анкеты есть отдельный полосчатый график renderAdReportChart).
function renderAdTimeseriesChart(days) {
  if (!days.length) return '<p class="muted">Нет данных</p>';
  const w = Math.max(360, days.length * 32), h = 150, padL = 18, padR = 18, padBottom = 22;
  const maxVal = Math.max(1, ...days.map(d => d.calls));
  const stepX = days.length > 1 ? (w - padL - padR) / (days.length - 1) : 0;
  const scaleY = v => (h - padBottom) - Math.round((v / maxVal) * (h - padBottom - 16));

  const points = days.map((d, i) => `${(padL + i*stepX).toFixed(1)},${scaleY(d.calls)}`).join(' ');
  const dots = days.map((d, i) => `<circle cx="${(padL + i*stepX).toFixed(1)}" cy="${scaleY(d.calls)}" r="2.5" fill="var(--accent)"></circle>`).join('');

  const labelEvery = Math.max(1, Math.ceil(days.length / 10));
  const labels = days.map((d, i) => i % labelEvery !== 0 ? '' : `
    <text x="${(padL + i*stepX).toFixed(1)}" y="${h - 4}" text-anchor="middle" font-size="10" fill="var(--muted)">${d.day.slice(8,10)}.${d.day.slice(5,7)}</text>`).join('');

  return `
    <svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:900px;height:auto;color:var(--text)">
      <line x1="${padL}" y1="${h-padBottom}" x2="${w-padR}" y2="${h-padBottom}" stroke="var(--border)" stroke-width="1"></line>
      <polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="2"></polyline>
      ${dots}
      ${labels}
    </svg>`;
}

// старые звонки хранят checklist_results в формате {state: yes|partial|no} —
// новые уже в {status: PASS|FAIL|PARTIAL|NA|UNCERTAIN}; приводим к единому виду для отображения
function checklistStatusOf(i) {
  if (i.status) return i.status;

  if (i.state === 'partial') return 'PARTIAL';
  if (i.state === 'no') return 'FAIL';
  return 'UNCERTAIN';

function fwOpenCall(callId) {
  const c = fwCallsCache.find(x => x.call_id === callId);
  if (!c) return;
  const a = c.analysis;
  const div = document.createElement('div');
  div.className = 'modal-bg';
  div.onclick = e => { if (e.target === div) div.remove(); };
  div.innerHTML = `<div class="modal">

    <b>Статус:</b> ${esc(c.status || '—')} · <b>Длительность:</b> ${fwDur(c.duration)} · <b>Ожидание:</b> ${c.wait ?? '—'} с</p>
    ${a ? `<div style="background:#f5f7fb;border-radius:10px;padding:12px 14px">
      <b>Оценка ИИ:</b> ${fwProbBadge(a)}

      ${a.signals && a.signals.length ? `<div class="row" style="flex-wrap:wrap;gap:6px">${a.signals.map(s => `<span class="tag">${esc(s)}</span>`).join('')}</div>` : ''}
      ${a.error ? `<p class="muted">${esc(a.error)}</p>` : ''}
    </div>` : '<p class="muted">ИИ-анализа нет.</p>'}
    <div class="row between" style="margin-top:16px">

// ---------- Звонки по анкетам (матрица анкета × день) ----------
async function fwRenderAnketas(el) {
  const r = fwRange.anketas || fwDefaultRange(14);
  const d = await api(`/fw/anketa-daily?date_from=${r.from}&date_to=${r.to}`);
  const dow = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
  const isWeekend = day => { const w = new Date(day + 'T00:00:00Z').getUTCDay(); return w === 0 || w === 6; };
  const sticky = 'position:sticky;left:0;background:#fff;z-index:1';
  const head = `<tr><th style="${sticky}">Анкета</th><th style="text-align:center">Всего</th>${d.days.map(day => `<th style="text-align:center;${isWeekend(day) ? 'background:#fff6e0' : ''}">${day.slice(8, 10)}.${day.slice(5, 7)}<div class="muted" style="font-size:10px">${dow[new Date(day + 'T00:00:00Z').getUTCDay()]}</div></th>`).join('')}</tr>`;
  const anketaRow = a => `<tr>
    <td style="${sticky}">${esc(a.name)}<div class="muted" style="font-size:11px">${esc(a.phone)}${a.active ? '' : ' · откл.'}</div></td>
    <td style="text-align:center"><b>${a.total}</b></td>

  const body = d.salons.map(st => {
    const subSticky = 'position:sticky;left:0;background:#eef3ff;z-index:1';
    return `<tr style="background:#eef3ff;font-weight:700"><td style="${subSticky}">${esc(st.salon)}</td><td style="text-align:center">${st.total}</td>
      ${d.days.map(day => `<td style="text-align:center">${st.by_day[day] || '·'}</td>`).join('')}</tr>`
      + d.anketas.filter(a => (a.salon || 'Салон не определён') === st.salon).map(anketaRow).join('');
  }).join('');
  const foot = `<tr style="font-weight:700;border-top:2px solid var(--border)"><td style="${sticky}">Все анкеты</td><td style="text-align:center">${d.grand_total}</td>
    ${d.days.map(day => `<td style="text-align:center">${d.col_totals[day] || '·'}</td>`).join('')}</tr>`;
  el.innerHTML = `
    <div class="card">
      <div class="row between" style="flex-wrap:wrap;gap:8px"><h3 style="margin:0">Звонки по анкетам</h3>${fwPeriodControls('anketas', 14)}</div>
      <div style="font-size:16px;margin:12px 0"><b>Итого на все анкеты: ${d.grand_total}</b> <span class="muted">звонков за ${fmtDate(d.date_from)} — ${fmtDate(d.date_to)}</span></div>
      <div class="row" style="flex-wrap:wrap;gap:14px;margin-bottom:12px">${d.salons.map(st => `<span><b>${esc(st.salon)}:</b> ${st.total}</span>`).join('')}</div>
      <div style="overflow-x:auto"><table style="min-width:${300 + d.days.length * 44}px">${head}${body || '<tr><td class="muted">Номеров нет</td></tr>'}${foot}</table></div>
      <p class="muted">Анкеты сгруппированы по салонам, синяя строка — итог салона. «Всего» — звонки анкеты за период, нижняя строка — все анкеты по дням. Выходные подсвечены. Прямые звонки на номера салонов не учитываются. Исключённые номера не учитываются.</p>
    </div>`;
}

// карточка администратора: сводка + вся история его звонков (включая
// исходящие перезвоны) — отвечает на "где посмотреть критические ошибки".
// Запись звонка слушается прямо из карточки звонка (см. openCall) — через
// UIS отдельно заходить не нужно.
// агрегирует, какие пункты чек-листа у этого набора звонков чаще всего
// проваливаются/частично выполняются — та же логика, что и в печатных
// отчётах (reports.js:checklistFunnel), но на клиенте, т.к. список звонков
// уже загружен; NA/UNCERTAIN не портят процент (см. checklistStatusOf)
function buildChecklistFunnel(calls) {
  const byText = new Map();
  for (const c of calls) {
    if (!c.checklist_results) continue;
    for (const item of c.checklist_results) {
      const status = checklistStatusOf(item);
      if (!byText.has(item.text)) byText.set(item.text, { pass: 0, partial: 0, fail: 0, na: 0, uncertain: 0 });
      const agg = byText.get(item.text);
      if (status === 'PASS') agg.pass++;
      else if (status === 'PARTIAL') agg.partial++;
      else if (status === 'FAIL') agg.fail++;
      else if (status === 'NA') agg.na++;
      else agg.uncertain++;
    }
  }
  return Array.from(byText.entries()).map(([text, agg]) => {
    const applicable = agg.pass + agg.partial + agg.fail;
    const pct = applicable ? Math.round(((agg.pass + agg.partial * 0.5) / applicable) * 100) : null;
    return { text, pct, applicable, ...agg };
  }).sort((a, b) => (a.pct ?? 101) - (b.pct ?? 101)); // без применимых случаев — в конец
}

async function openAdminProfile(id) {
  const a = ADMINS.find(x => x.id === id);
  if (!a) return;
  const calls = await api('/calls?admin_id=' + id);
  // анкетные/рекламные звонки оцениваются по отдельному чек-листу "Анкета" —
  // не должны портить/улучшать общий Quality Score и разбор по пунктам
  const scoreableCalls = calls.filter(c => !c.is_ad_call);
  const scored = scoreableCalls.filter(c => c.checklist_total);
  const avgPct = scored.length ? Math.round(scored.reduce((s,c) => s + c.checklist_score/c.checklist_total, 0) / scored.length * 100) : null;
  const bookingCount = calls.filter(c => c.outcome === 'booking').length;

  const criticalItems = [];
  calls.forEach(c => {
    if (!c.critical_errors) return;
    try { JSON.parse(c.critical_errors).forEach(e => criticalItems.push({ call: c, error: e })); } catch { /* noop */ }
  });

  const funnel = buildChecklistFunnel(scoreableCalls).filter(f => f.applicable > 0 || f.na || f.uncertain);

  const rows = calls.map(c => `<tr>
    <td>${esc(c.started_at)}</td><td>${salonCell(c)}${c.is_ad_call ? ' <span class="tag">анкета</span>' : ''}</td><td>${c.direction==='in'?'вх':'исх'}</td>
    <td>${qualityBadge(c.checklist_score, c.checklist_total)}</td>
    <td>${esc(c.outcome||'—')}</td>
    <td><button onclick="openCall(${c.id})">Открыть</button></td>
  </tr>`);

  const criticalRows = criticalItems.map(({call, error}) => `<tr>
    <td>${esc(call.started_at)}</td><td>${esc(call.salon_name)}</td>
    <td><b>${esc(error.description || error.type || '')}</b>${error.evidence ? `<div class="muted">«${esc(error.evidence)}»</div>` : ''}</td>
    <td><button onclick="openCall(${call.id})">Открыть</button></td>
  </tr>`);

  const funnelRows = funnel.map(f => `<tr>
    <td>${esc(f.text)}</td>
    <td>${f.applicable ? `<span style="font-weight:600;color:${qualityColor(f.pct)}">${f.pct}%</span>` : '<span class="muted">не применялось</span>'}</td>
    <td>✅${f.pass} ⚠️${f.partial} ❌${f.fail}${f.na ? ` ➖${f.na}` : ''}${f.uncertain ? ` ❓${f.uncertain}` : ''}</td>
  </tr>`);

  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)this.remove()">
      <div class="modal" style="max-width:900px">
        <div class="row between">
          <h3 style="margin:0">${esc(a.name)}</h3>
          <button onclick="document.querySelector('.modal-bg').remove()">✕</button>
        </div>
        <p class="muted">Работал(а) в: ${esc(a.worked_salons || '—')} · Статус: ${a.status==='confirmed'?'подтверждён':'не подтверждён'}</p>
        <div class="row" style="gap:24px;margin:14px 0">
          <div><b style="font-size:20px">${calls.length}</b><div class="muted">звонков</div></div>
          <div><b style="font-size:20px;${avgPct!=null?`color:${qualityColor(avgPct)}`:''}">${avgPct==null?'—':avgPct+'%'}</b><div class="muted">Quality Score</div></div>
          <div><b style="font-size:20px">${criticalItems.length}</b><div class="muted">критических ошибок</div></div>
          <div><b style="font-size:20px">${bookingCount}</b><div class="muted">записей</div></div>
        </div>

        ${criticalItems.length ? `
        <h4 style="color:#d33">⚠️ Критические ошибки</h4>
        <table><tr><th>Дата</th><th>Объект</th><th>Ошибка</th><th></th></tr>${criticalRows.join('')}</table>` : ''}

        ${funnel.length ? `
        <h4>📉 По пунктам чек-листа (где слабее всего)</h4>
        <table><tr><th>Пункт</th><th>Выполнение</th><th>Детали</th></tr>${paginatedRows(funnelRows, 8)}</table>` : ''}

        <h4>Звонки</h4>
        <table><tr><th>Дата</th><th>Объект</th><th>Напр.</th><th>Чек-лист</th><th>Исход</th><th></th></tr>
          ${paginatedRows(rows, 20) || '<tr><td colspan="6" class="muted">Звонков нет</td></tr>'}
        </table>
      </div>
    </div>`;
}

async function saveSalon(id) {

// Доп. номера объекта — на случай, если на салон льются звонки с разных
// рекламных площадок (разные номера с переадресацией на один и тот же объект).
async function manageSalonPhones(salonId) {
  const salon = SALONS.find(s => s.id === salonId);
  const phones = await api(`/salons/${salonId}/phones`);
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <h3>Номера объекта «${esc(salon.name)}»</h3>
        <p class="muted">Основной номер: ${esc(salon.phone)}. Ниже — дополнительные номера (например, с разных
        рекламных площадок с переадресацией на этот салон) — звонки на любой из них будут
        распознаны как звонки этому объекту.</p>
        <table id="salon-phones-table">${renderSalonPhonesRows(phones)}</table>
        <div class="row" style="margin-top:12px">
          <input id="new-phone" placeholder="Номер">
          <input id="new-phone-note" placeholder="Заметка (например, «Авито»)">
          <button class="primary" onclick="addSalonPhone(${salonId})">+ Добавить номер</button>
        </div>
        <div class="row between" style="margin-top:16px">

function renderSalonPhonesRows(phones) {
  return `<tr><th>Номер</th><th>Заметка</th><th></th></tr>` +
    (phones.map(p => `<tr><td>${esc(p.phone)}</td><td>${esc(p.note||'—')}</td>
      <td><button class="danger" onclick="deleteSalonPhone(${p.salon_id},${p.id})">Удалить</button></td></tr>`).join('')
    || '<tr><td colspan="3" class="muted">Дополнительных номеров нет</td></tr>');
}
async function addSalonPhone(salonId) {
  const phone = document.getElementById('new-phone').value.trim();
  const note = document.getElementById('new-phone-note').value.trim();

}
async function deleteSalonPhone(salonId, phoneId) {
  await api(`/salons/${salonId}/phones/${phoneId}`, { method: 'DELETE' });
  manageSalonPhones(salonId);
}

// Метки, которыми UIS обозначает этот салон для звонков на общий номер
// с голосовым меню — у одного салона их может быть несколько (разные
// источники трафика называют его по-разному). Точное значение видно в логе

async function manageSalonLabels(salonId) {

    <div class="modal-bg" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <h3>Метки UIS для «${esc(salon.name)}»</h3>
        <p class="muted">Нужно только для номеров с общим голосовым меню на несколько салонов
        (см. «Настройки» → «Общие номера с меню»). Точное значение метки — из лога сервера
        после тестового звонка на такой номер.</p>
        <table id="salon-labels-table">${renderSalonLabelsRows(labels)}</table>
        <div class="row" style="margin-top:12px">
          <input id="new-label" placeholder="Например: 8 марта (VIP) (amoCRM)" style="min-width:280px">

function renderSalonLabelsRows(labels) {

    (labels.map(l => `<tr><td>${esc(l.label)}</td>
      <td><button class="danger" onclick="deleteSalonLabel(${l.salon_id},${l.id})">Удалить</button></td></tr>`).join('')
    || '<tr><td colspan="2" class="muted">Меток нет</td></tr>');
}
async function addSalonLabel(salonId) {
  const label = document.getElementById('new-label').value.trim();
  if (!label) return alert('Укажите метку');
  await api(`/salons/${salonId}/labels`, { method: 'POST', body: { label } });
  manageSalonLabels(salonId);
}
async function deleteSalonLabel(salonId, labelId) {
  await api(`/salons/${salonId}/labels/${labelId}`, { method: 'DELETE' });
  manageSalonLabels(salonId);
}

// Переадресация объекта на другой по расписанию (днём Рай -> 8 Марта): звонки
// на номер объекта в эти часы записываются за салоном, который их принимает.
const WEEKDAY_LABELS = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
function forwardingHoursText(r) {
  return r.time_from === r.time_till ? 'весь день' : `${r.time_from}–${r.time_till}${r.time_till < r.time_from ? ' (через полночь)' : ''}`;
}
async function manageSalonForwarding(salonId) {
  const salon = SALONS.find(s => s.id === salonId);
  const rules = await api(`/salons/${salonId}/forwarding`);
  const targets = SALONS.filter(s => s.active && s.id !== salonId);
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-bg" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <h3>Переадресация «${esc(salon.name)}»</h3>
        <p class="muted">Когда объект не работает и звонки на его номер уходят в другой салон. Входящие звонки
        в эти дни и часы будут записываться за салоном, который их принимает, — пропущенные и перезвоны
        считаются там же. В списке звонков у них пометка «↪ из «${esc(salon.name)}»».
        Время — как в списке звонков CRM. 00:00–00:00 — весь день.</p>
        <table>
          <tr><th>Куда</th><th>Дни</th><th>Часы</th><th></th></tr>
          ${rules.map(r => `<tr><td>${esc(r.target_name)}</td>
            <td>${r.weekdays.split(',').map(d => WEEKDAY_LABELS[Number(d) - 1]).join(', ')}</td>
            <td>${forwardingHoursText(r)}</td>
            <td><button class="danger" onclick="deleteSalonForwarding(${salonId},${r.id})">Удалить</button></td></tr>`).join('')
            || '<tr><td colspan="4" class="muted">Переадресации нет</td></tr>'}
        </table>
        <div style="margin-top:14px;display:flex;flex-direction:column;gap:10px">
          <label>Куда переадресуется
            <select id="fw-target">${targets.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select>
          </label>
          <div class="row" style="flex-wrap:wrap;gap:10px">
            ${WEEKDAY_LABELS.map((l, i) => `<label style="display:flex;align-items:center;gap:4px"><input type="checkbox" class="fw-day" value="${i + 1}">${l}</label>`).join('')}
          </div>
          <div class="row" style="flex-wrap:wrap;gap:10px">
            <label>С <input id="fw-from" type="time" value="00:00"></label>
            <label>До <input id="fw-till" type="time" value="00:00"></label>
            <button class="primary" onclick="addSalonForwarding(${salonId})">+ Добавить</button>
          </div>
        </div>
        <div class="row between" style="margin-top:16px;flex-wrap:wrap;gap:8px">
          <button onclick="reapplyForwarding()">Пересчитать звонки за 30 дней</button>
          <button onclick="document.querySelector('.modal-bg').remove()">Закрыть</button>
        </div>
      </div>
    </div>`;
}
async function addSalonForwarding(salonId) {
  const weekdays = [...document.querySelectorAll('.fw-day:checked')].map(el => Number(el.value));
  const body = {
    target_salon_id: Number(document.getElementById('fw-target').value),
    weekdays,
    time_from: document.getElementById('fw-from').value,
    time_till: document.getElementById('fw-till').value
  };
  try {
    await api(`/salons/${salonId}/forwarding`, { method: 'POST', body });
    manageSalonForwarding(salonId);
  } catch (e) { alert(e.message); }
}
async function deleteSalonForwarding(salonId, ruleId) {
  if (!confirm('Удалить правило переадресации?')) return;
  await api(`/salons/${salonId}/forwarding/${ruleId}`, { method: 'DELETE' });
  manageSalonForwarding(salonId);
}
async function reapplyForwarding() {
  if (!confirm('Пересчитать входящие звонки за последние 30 дней по текущим правилам переадресации? Звонки, попавшие под правила, перейдут в принимающий салон; перенесённые по удалённым правилам вернутся обратно.')) return;
  try {
    const r = await api('/forwarding/reapply', { method: 'POST', body: { days: 30 } });
    alert(`Готово: перенесено ${r.moved}, возвращено обратно ${r.restored}.`);
  } catch (e) { alert(e.message); }
}

let CHECKLIST_ITEMS = [];

RENDERERS.checklist = async function renderChecklist() {

  CHECKLIST_ITEMS = [...salonTpl, ...saunaTpl, ...anketaTpl];
  const main = document.getElementById('main');
  const itemRow = i => `<tr>
    <td>${esc(i.text)}${i.not_applicable_hint ? `<div class="muted" style="font-size:12px">не применим: ${esc(i.not_applicable_hint)}</div>` : ''}</td>
    <td>${i.weight}</td>
    <td>${i.critical ? '<span class="tag warn">да</span>' : '—'}</td>
    <td>${i.salary_penalty_allowed ? '' : '<span class="tag">нет</span>'}</td>

    <td class="row">
      <button onclick="editChecklistItem(${i.id})">Изменить</button>
      <button onclick="toggleItem(${i.id}, ${i.active?0:1})">${i.active?'Выключить':'Включить'}</button>
      <button class="danger" onclick="deleteItem(${i.id})">Удалить</button>
    </td></tr>`;
  const tplBlock = (title, tpl, items) => `
    <div class="card">
      <div class="row between"><h3 style="margin:0">Шаблон «${title}»</h3><button onclick="showChecklistItemForm({template:'${tpl}'})">+ Пункт</button></div>
      <table><tr><th>Текст</th><th>Вес</th><th>Критичный</th><th>Без штрафа ЗП</th><th></th><th></th></tr>
        ${items.map(itemRow).join('')}</table>
    </div>`;

  main.innerHTML = `
    ${settingsTabsHtml('checklist')}
    <h2>Чек-листы контроля скрипта</h2>
    <p class="muted">Вес — сколько баллов даёт пункт при выполнении. Критичный — явная грубая ошибка, если
    не выполнен (отдельно от обычных пунктов). «Без штрафа ЗП» — пункт участвует в Quality Score, но не
    должен влиять на зарплатный расчёт. «Когда не применим» — подсказка для ИИ, в каких ситуациях пункт
    не нужен (тогда это NA, а не минус балл) — например, «клиент уже был и знает все условия».</p>
    ${tplBlock('Салон', 'salon', salonTpl)}
    ${tplBlock('Сауна', 'sauna', saunaTpl)}
    <p class="muted">«Анкета» — для звонков на рекламный/анкетный номер (раздел «Анкеты»): администратор
    заранее знает, что звонок не по скрипту конкретного объекта, поэтому оценивается отдельно и не входит
    в общий рейтинг Quality Score. Единый на всю сеть, без привязки к объекту.</p>
    ${tplBlock('Анкета', 'anketa', anketaTpl)}
    <div class="card">
      <h3>Личные пункты объектов (добавки поверх шаблона / приватные списки)</h3>
      ${SALONS.map(s => `<div style="margin-bottom:12px">
        <div class="row between"><b>${esc(s.name)}</b> <button onclick="showChecklistItemForm({salon_id:${s.id}})">+ Пункт для этого объекта</button></div>
      </div>`).join('')}
      <p class="muted">Отвязать объект от шаблона целиком можно на вкладке «Салоны».</p>
    </div>
    <div id="modal-root"></div>
  `;
};

function checklistItemFormHtml(item) {
  const title = item.id ? 'Изменить пункт' : 'Новый пункт';
  return `
    <div class="modal-bg" onclick="if(event.target===this)this.remove()">
      <div class="modal">
        <h3>${title}</h3>
        <div class="row" style="flex-direction:column;align-items:stretch">
          <textarea id="ci-text" placeholder="Текст пункта">${esc(item.text||'')}</textarea>
          <label>Вес<input id="ci-weight" type="number" min="1" value="${item.weight ?? 1}"></label>
          <label class="row"><input id="ci-critical" type="checkbox" ${item.critical?'checked':''}> Критичный пункт (грубая ошибка, если не выполнен)</label>
          <label class="row"><input id="ci-salary" type="checkbox" ${item.salary_penalty_allowed===false?'':'checked'}> Невыполнение может влиять на зарплату</label>
          <textarea id="ci-hint" placeholder="Когда пункт НЕ применим (необязательно) — например: «клиент уже был и знает все условия»">${esc(item.not_applicable_hint||'')}</textarea>
        </div>
        <div class="row between" style="margin-top:16px">
          <button onclick="document.querySelector('.modal-bg').remove()">Отмена</button>
          <button class="primary" onclick="saveChecklistItem(${item.id||'null'}, ${item.template?`'${item.template}'`:'null'}, ${item.salon_id||'null'})">Сохранить</button>
        </div>
      </div>
    </div>`;
}
function showChecklistItemForm(item) {
  document.getElementById('modal-root').innerHTML = checklistItemFormHtml(item);
}
function editChecklistItem(id) {
  const item = CHECKLIST_ITEMS.find(i => i.id === id);
  if (!item) return;
  document.getElementById('modal-root').innerHTML = checklistItemFormHtml(item);
}
async function saveChecklistItem(id, template, salonId) {

function trendSparkline(counts, status) {
  const w = 96, h = 26, pad = 3;
  const max = Math.max(1, ...counts.filter(v => v !== null));
  const x = i => pad + (i * (w - 2 * pad)) / (counts.length - 1);
  const y = v => h - pad - (v / max) * (h - 2 * pad);
  let d = '', prevNull = true;
  counts.forEach((v, i) => {
    if (v === null) { prevNull = true; return; }
    d += `${prevNull ? 'M' : 'L'}${x(i).toFixed(1)},${y(v).toFixed(1)} `;
    prevNull = false;
  });
  const lastV = counts[counts.length - 1];
  const dot = lastV === null ? '' : `<circle cx="${x(counts.length - 1)}" cy="${y(lastV)}" r="2.5" fill="${TREND_COLORS[status]}"/>`;
  return `<svg width="${w}" height="${h}" style="vertical-align:middle"><path d="${d}" fill="none" stroke="#7a8296" stroke-width="1.5"/>${dot}</svg>`;
}

function fmtChange(v) {
  if (v === null || v === undefined) return '<span class="muted">—</span>';
  const p = Math.round(v * 100);
  const color = p <= -40 ? TREND_COLORS.red : p < -15 ? TREND_COLORS.yellow : p >= 15 ? TREND_COLORS.green : 'inherit';
  return `<span style="font-weight:600;color:${color}">${p > 0 ? '+' : ''}${p}%</span>`;
}

function renderAdTrend(data) {
  if (!data.rows.length) return `<h3 style="margin-top:0">📉 Тренд анкет</h3><p class="muted">Номера анкет не добавлены — Настройки → Номера и анкеты.</p>`;
  const byStatus = s => data.rows.filter(r => r.status === s).length;
  const net = data.network;
  const first = data.windows[0].label, last = data.windows[data.windows.length - 1].label;
  const flaggedCount = byStatus('red') + byStatus('yellow');

  const rows = data.rows.map(r => {
    const flags = r.flags.map(f => `<div style="color:${TREND_COLORS[f.level]};font-size:12px">${esc(f.text)}</div>`).join('');
    const conv = r.analyzed4w ? `${r.bookings4w} из ${r.analyzed4w} <span class="muted">(${Math.round(r.conv * 100)}%)</span>` : '<span class="muted">—</span>';
    return `<tr>
      <td class="t-dot"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${TREND_COLORS[r.status]}" title="${TREND_STATUS_LABELS[r.status]}"></span></td>
      <td class="t-label">${esc(r.label)}<div class="muted" style="font-size:11px">${esc(r.phone)}${r.note ? ' · ' + noteOrLink(r.note) : ''}</div></td>
      <td title="${esc(r.counts.map(v => v ?? '—').join(' · '))}">${trendSparkline(r.counts, r.status)}</td>
      <td style="text-align:center" data-l="7 дней">${r.last ?? '—'}</td>
      <td style="text-align:center" data-l="среднее">${r.baseline === null ? '—' : r.baseline.toFixed(1)}</td>
      <td style="text-align:center" data-l="изм.">${fmtChange(r.adjChange)}</td>
      <td style="text-align:center" data-l="записи">${conv}</td>
      <td>${flags || '<span class="muted">—</span>'}</td>
      <td>${r.status === 'red' || r.status === 'yellow' ? `<button onclick="markAnketaReplaced(${r.id})">Заменил</button>` : ''}</td>
    </tr>`;
  });

  return `
    <h3 style="margin-top:0">📉 Тренд анкет — что пора заменить</h3>
    <p class="muted">Недели — скользящие 7 дней (${esc(first)} … ${esc(last)}). Изменение считается к среднему анкеты за 4 предыдущие недели
      <b>с поправкой на всю сеть</b>: сейчас вся сеть анкет — ${net.last} звонков за 7 дней (${net.change >= 0 ? '+' : ''}${Math.round(net.change * 100)}%),
      поэтому общий спад не записывается в вину конкретной анкете.</p>
    <div class="row" style="flex-wrap:wrap;gap:12px;margin:8px 0">
      ${['red', 'yellow', 'green', 'new'].map(s => `<span><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${TREND_COLORS[s]}"></span> ${TREND_STATUS_LABELS[s]}: <b>${byStatus(s)}</b></span>`).join('')}
    </div>
    ${renderAdInsight(data.insight)}
    <div style="overflow-x:auto;margin-top:12px">
      <table class="trend-table" style="min-width:820px">
        <tr class="trend-head"><th></th><th>Анкета</th><th>8 недель</th><th>7 дней</th><th>Среднее 4 нед</th><th>Изменение</th><th>Записи (4 нед)</th><th>Флаги</th><th></th></tr>
        ${paginatedRows(rows, Math.max(flaggedCount, 5))}
      </table>
    </div>`;
}

// Понедельно-дневная разница по датам ("что стало с конкретной анкетой в
// эти выходные") — таблица анкета×день читается для этого лучше линейного
// графика: десятки анкет линиями разного цвета накладывались бы друг на
// друга и сравнить конкретный день было бы невозможно.
function renderAdDailyTable(data) {
  if (!data.rows.length) return '<p class="muted">Список номеров пуст — добавьте номера выше</p>';
  const isWeekend = d => { const wd = new Date(d + 'T00:00:00Z').getUTCDay(); return wd === 0 || wd === 6; };
  const sticky = 'position:sticky;left:0;background:#fff;z-index:1';
  const header = `<tr><th style="${sticky}">Анкета</th>${data.days.map(d => `<th style="text-align:center;${isWeekend(d)?'background:#fff6e0':''}">${d.slice(8,10)}.${d.slice(5,7)}</th>`).join('')}</tr>`;
  const rows = data.rows.map(r => {
    const cells = r.counts.map((c, i) => `<td style="text-align:center;${isWeekend(data.days[i])?'background:#fffaf0':''}">${c || ''}</td>`).join('');
    return `<tr><td style="${sticky}">${esc(r.label)}<div class="muted" style="font-size:11px">${esc(r.phone)}</div></td>${cells}</tr>`;
  }).join('');
  return `<div style="overflow-x:auto"><table style="min-width:${360 + data.days.length * 44}px">${header}${rows}</table></div>`;
}

function noteOrLink(note) {
  if (!note) return '—';
  const trimmed = note.trim();
  return /^https?:\/\//i.test(trimmed) ? `<a href="${esc(trimmed)}" target="_blank" rel="noopener">ссылка</a>` : esc(trimmed);
}

    (rows.map(r => `<tr><td>${esc(r.label)}</td><td>${esc(r.phone)}</td><td>${noteOrLink(r.note)}</td>
      <td><input type="date" value="${esc(r.placed_at || '')}" onchange="setAdPlacedAt(${r.id}, this.value)"></td>

// Горизонтальные полоски вместо SVG-графика — при десятках анкет читается
// заметно лучше, чем сгруппированные столбцы (не слипаются подписи), и сразу
// видно и работающие, и "пустые" анкеты (серая, нулевая полоска).
function renderAdReportChart(rows) {
  if (!rows.length) return '<p class="muted">Список номеров пуст — добавьте номера выше</p>';
  const maxVal = Math.max(1, ...rows.map(r => r.calls));
  return rows.map(r => `
    <div style="margin-bottom:10px">
      <div class="row between" style="font-size:13px;margin-bottom:3px">
        <span>${esc(r.label)} <span class="muted">(${esc(r.phone)})</span></span>
        <b>${r.calls}</b>
      </div>
      <div style="background:var(--bg);border-radius:4px;overflow:hidden;height:10px">
        <div style="width:${Math.round(r.calls/maxVal*100)}%;background:${r.calls>0?'var(--accent)':'var(--border)'};height:100%"></div>
      </div>
    </div>`).join('');
}

async function saveAiSettings() {
  await api('/settings/ai', { method: 'PUT', body: {
    openai_api_key: document.getElementById('s-openai-key').value.trim(),
    company_context: document.getElementById('s-context').value,
    transcribe_model: document.getElementById('s-transcribe-model').value.trim(),
    analysis_model: document.getElementById('s-analysis-model').value.trim(),
    rub_per_usd: Number(document.getElementById('s-rate').value)
  }});
  RENDERERS.settings();
}
async function saveTelephonySettings() {
  await api('/settings/telephony', { method: 'PUT', body: {
    uis_login: document.getElementById('t-login').value.trim(),
    uis_api_key: document.getElementById('t-key').value.trim(),
    poll_interval_sec: Number(document.getElementById('t-interval').value),
    callback_window_min: Number(document.getElementById('t-callback').value),
    uis_timezone_offset_hours: Number(document.getElementById('t-tz').value),
    enabled: document.getElementById('t-enabled').checked
  }});
  RENDERERS.settings();
}
// datetime-local не несёт часовой пояс. UIS ждёт время в СВОЁМ часовом поясе
// (не UTC!) — переводим выбранный момент в реальный UTC, затем сдвигаем на
// офсет из настроек, чтобы получить именно то, что понимает UIS.
function localDatetimeToUisLocal(value, offsetHours) {
  return new Date(new Date(value).getTime() + offsetHours * 3600000).toISOString().slice(0, 19).replace('T', ' ');
}
async function runBackfill() {
  const fromVal = document.getElementById('bf-from').value;
  const tillVal = document.getElementById('bf-till').value;
  if (!fromVal || !tillVal) return alert('Укажите обе даты');
  const offsetHours = Number(document.getElementById('t-tz').value);
  const resultEl = document.getElementById('bf-result');
  resultEl.textContent = 'Загрузка…';
  try {
    const result = await api('/settings/telephony/backfill', { method: 'POST', body: {
      date_from: localDatetimeToUisLocal(fromVal, offsetHours),
      date_till: localDatetimeToUisLocal(tillVal, offsetHours)
    }});
    resultEl.textContent = `Готово: получено ${result.total}, распределено по салонам ${result.matched}` +
      (result.unmatchedNumbers.length ? `, непривязанные номера: ${result.unmatchedNumbers.join('; ')}` : '');
  } catch (e) {
    resultEl.textContent = 'Ошибка: ' + e.message;
  }
}

// Файл — не JSON, поэтому напрямую через fetch с FormData, в обход api().
async function uploadCsv() {
  const input = document.getElementById('csv-file');
  const resultEl = document.getElementById('csv-result');
  if (!input.files.length) return alert('Выберите файл');
  const fd = new FormData();
  fd.append('file', input.files[0]);
  resultEl.textContent = 'Загрузка и обработка…';
  try {
    const resp = await fetch('/api/settings/telephony/import-csv', { method: 'POST', body: fd });
    const r = await resp.json();
    if (!resp.ok) throw new Error(r.error || ('HTTP ' + resp.status));
    let html = `Готово: обработано ${r.totalRows}, добавлено ${r.inserted}, уже были в базе ${r.duplicates}, исключённых ${r.excluded}.`;
    if (r.badDates) html += ` Пропущено строк с нераспознанной датой: ${r.badDates}.`;
    if (r.matchedBySalon.length) html += '<br>По салонам: ' + r.matchedBySalon.map(s => `${esc(s.name)}: ${s.count}`).join(', ');
    if (r.unmatchedByLabel.length) html += '<br>Непривязанные метки UIS (добавьте через «Метки UIS» и загрузите файл ещё раз): ' + r.unmatchedByLabel.map(x => `«${esc(x.label)}»: ${x.count}`).join(', ');
    if (r.unmatchedByNumber.length) html += '<br>Непривязанные номера (без метки): ' + r.unmatchedByNumber.map(x => `${esc(x.number)}: ${x.count}`).join(', ');
    resultEl.innerHTML = html;
    input.value = '';
  } catch (e) {
    resultEl.textContent = 'Ошибка: ' + e.message;
  }
}

    || '<tr><td colspan="3" class="muted">Общих номеров с меню нет</td></tr>');
}

RENDERERS.guest = async function renderGuest() {
  const main = document.getElementById('main');
  main.innerHTML = `<h2>Гости сегодня</h2><div id="guest-status" class="muted" style="margin-bottom:10px"></div><div id="guest-list">Загрузка…</div>
    <div class="row" style="margin-top:16px">
      <button class="primary" onclick="addWalkin()">+ Добавить визит (гость без звонка)</button>
      <button onclick="closeDay()">Закрыть день</button>
    </div>`;
  await loadGuestBookings();
  const status = await api('/guest/day-status');
  document.getElementById('guest-status').textContent = status.closed ? `День ${status.date} закрыт ✅` : `День ${status.date} ещё не закрыт`;
};

async function loadGuestBookings() {
  const bookings = await api('/guest/bookings?range=today');
  document.getElementById('guest-list').innerHTML = bookings.map(b => `
    <div class="guest-card">
      <div class="row between">
        <div><div class="time">${esc((b.scheduled_at||'').slice(-5) || b.scheduled_at)}</div>
        <div>${esc(b.client_name || b.client_phone)}</div><div class="muted">${esc(b.note||'')}</div></div>
        <div class="row">
          ${b.status==='upcoming' ? `
            <button class="ok" onclick="markBooking(${b.id}, true)">Пришёл</button>
            <button class="danger" onclick="markBooking(${b.id}, false)">Не пришёл</button>` :
            `<span class="tag ${b.status==='arrived'?'done':'error'}">${b.status==='arrived'?'пришёл':'не пришёл'}</span>`}
        </div>
      </div>
    </div>`).join('') || '<p class="muted">Записей на сегодня нет</p>';
}

async function markBooking(id, arrived) { await api(`/guest/bookings/${id}/mark`, { method: 'POST', body: { arrived } }); loadGuestBookings(); }

async function addWalkin() {
  const phone = prompt('Телефон гостя:');
  if (!phone) return;
  const name = prompt('Имя (необязательно):') || '';
  await api('/guest/visits', { method: 'POST', body: { phone, name } });
  alert('Визит добавлен');
  loadGuestBookings();
}

async function closeDay() {
  if (!confirm('Закрыть день? Убедитесь, что все записи отмечены.')) return;
  await api('/guest/close-day', { method: 'POST' });
  RENDERERS.guest();
}
